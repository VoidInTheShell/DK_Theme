name: Build, Publish and Deploy Theme

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Formal version (vX.Y.Z); publish only, never deploy. Empty keeps the transitional workflow."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: voidintheshell/dk_theme

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build staging assets
        env:
          VITE_BASE_PATH: /dk-theme/
          VITE_APP_NAME: UEG-Net
          VITE_API_BASE_URL: /
          VITE_ENABLE_MOCK: "false"
        run: npm run build

      - name: Validate staged brand asset and administrator route synchronizer
        run: |
          set -Eeuo pipefail
          test -s dist/ueg-mark.png
          grep -R --fixed-strings '/dk-theme/ueg-mark.png' dist/index.html dist/assets > /dev/null
          grep --fixed-strings 'xboard-admin-route' deploy/staging/nginx.conf > /dev/null
          grep --fixed-strings '__ADMIN_PATH__' deploy/staging/admin-route.conf.template > /dev/null
          grep --fixed-strings 'xboard-admin:80' deploy/staging/admin-route.conf.template > /dev/null
          bash -n deploy/staging/admin-route-sync.sh
          bash -n deploy/staging/update-theme.sh
          bash -n deploy/production/update-theme.sh

      - name: Build and validate the runtime image
        run: |
          docker build \
            --build-arg VITE_BASE_PATH=/dk-theme/ \
            --build-arg VITE_APP_NAME='UEG-Net' \
            --build-arg VITE_API_BASE_URL=/ \
            --build-arg VITE_ENABLE_MOCK=false \
            --tag dk-theme-ci:${GITHUB_SHA} \
            .
          docker run --rm --add-host xboard-app:127.0.0.1 dk-theme-ci:${GITHUB_SHA} nginx -t
          docker run --rm --entrypoint sh dk-theme-ci:${GITHUB_SHA} -ec \
            "test -s /usr/share/nginx/html/dk-theme/ueg-mark.png && test -x /usr/local/bin/xboard-admin-route-sync && grep -F xboard-admin-route /etc/nginx/conf.d/default.conf > /dev/null"


  prepare-release:
    name: Freeze version and release plan
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      plan_artifact: release-plan-${{ steps.plan.outputs.version }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Prepare exact version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 .github/scripts/release.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ steps.plan.outputs.version }}
          overwrite: true
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  build-and-push:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: [test, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Verify checkout and load frozen plan
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - name: Preserve an already built version on retry
        id: existing-image
        run: python3 .github/scripts/release.py image-check

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        if: steps.existing-image.outputs.exists != 'true'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare-release.outputs.version }}
            VITE_BASE_PATH=/dk-theme/
            VITE_APP_NAME=UEG-Net
            VITE_API_BASE_URL=/
            VITE_ENABLE_MOCK=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Report staging image tag
        env:
          IMAGE_TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Published staging image: ${image}"
          printf 'Staging image: `%s`\n' "${image}" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Update GJHK staging theme
    # Paused while upgrades are validated through the panel-owned updater.
    if: >-
      false &&
      inputs.release_version == '' &&
      startsWith(github.ref, 'refs/heads/') &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/dev')
      )
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: staging-${{ github.repository_id }}
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.STAGING_PANEL_URL }}
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
      SSH_USER: ${{ vars.STAGING_SSH_USER }}
      PANEL_URL: ${{ vars.STAGING_PANEL_URL }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      THEME_IMAGE: ghcr.io/voidintheshell/dk_theme:${{ needs.build-and-push.outputs.image_tag }}
      REMOTE_BUNDLE: /home/beihai/docker/.incoming/dk-theme-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate staging configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?STAGING_SSH_HOST is required}"
          : "${SSH_PORT:?STAGING_SSH_PORT is required}"
          : "${SSH_USER:?STAGING_SSH_USER is required}"
          : "${PANEL_URL:?STAGING_PANEL_URL is required}"
          : "${SSH_PRIVATE_KEY:?STAGING_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?STAGING_SSH_KNOWN_HOSTS is required}"
          if ! [[ "${THEME_IMAGE}" =~ ^ghcr\.io/voidintheshell/dk_theme:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "THEME_IMAGE must be a DK Theme GHCR image with a version tag" >&2
            exit 1
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          install -d -m 700 "${SSH_DIR}"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${SSH_DIR}/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${SSH_DIR}/known_hosts"

      - name: Upload and deploy theme
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          SCP_ARGS=(-i "${SSH_DIR}/id_ed25519" -P "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "install -d -m 700 '${REMOTE_BUNDLE}'"
          scp "${SCP_ARGS[@]}" deploy/staging/update-theme.sh "${SSH_TARGET}:${REMOTE_BUNDLE}/update-theme.sh"
          printf '%s\n' "${GHCR_TOKEN}" | ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "chmod 700 '${REMOTE_BUNDLE}/update-theme.sh' && '${REMOTE_BUNDLE}/update-theme.sh' '${THEME_IMAGE}' '${GITHUB_ACTOR}'"

      - name: Verify public theme entrypoint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${PANEL_URL}/healthz" > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "${PANEL_URL}/" > /dev/null
          logo_file=$(mktemp)
          admin_page=$(mktemp)
          original_admin_page=$(mktemp)
          trap 'rm -f -- "${logo_file}" "${admin_page}" "${original_admin_page}"' EXIT
          logo_type=$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --output "${logo_file}" --write-out '%{content_type}' "${PANEL_URL}/dk-theme/ueg-mark.png")
          test -s "${logo_file}"
          case "${logo_type}" in
            image/png*) ;;
            *) echo "Unexpected brand mark content type: ${logo_type}" >&2; exit 1 ;;
          esac
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          active_path=$(ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "sudo -n docker exec xboard-theme cat /var/run/xboard-admin-route/active-path")
          [[ "${active_path}" =~ ^[A-Za-z0-9_-]{8,}$ && "${active_path}" != "passport" ]]
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            "${PANEL_URL}/${active_path}/" > "${admin_page}"
          grep --fixed-strings '<title>XBoard Admin</title>' "${admin_page}" > /dev/null
          grep --fixed-strings 'data-xboard-admin-shell="standalone"' "${admin_page}" > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            "${PANEL_URL}/${active_path}/original" > "${original_admin_page}"
          grep --extended-regexp '<title>[^<]+</title>' "${original_admin_page}" > /dev/null
          grep --fixed-strings '/assets/admin/' "${original_admin_page}" > /dev/null

      - name: Remove deployment bundle
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          if [ -f "${SSH_DIR}/id_ed25519" ] && [ -n "${SSH_HOST:-}" ] && [ -n "${REMOTE_BUNDLE:-}" ]; then
            ssh -i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts" "${SSH_USER}@${SSH_HOST}" "case '${REMOTE_BUNDLE}' in /home/beihai/docker/.incoming/dk-theme-*) rm -rf -- '${REMOTE_BUNDLE}' ;; *) exit 1 ;; esac"
          fi
          rm -rf -- "${SSH_DIR}"

  deploy-production:
    name: Update JPGREEN production theme
    # Keep recovery implementation without deploying from CI.
    if: >-
      false &&
      inputs.release_version == '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: production-${{ github.repository_id }}
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_PANEL_URL }}
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PANEL_URL: ${{ vars.PRODUCTION_PANEL_URL }}
      ADMIN_PATH: ${{ vars.PRODUCTION_ADMIN_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      THEME_IMAGE: ghcr.io/voidintheshell/dk_theme:${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Validate production configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?PRODUCTION_SSH_HOST is required}"
          : "${SSH_PORT:?PRODUCTION_SSH_PORT is required}"
          : "${SSH_USER:?PRODUCTION_SSH_USER is required}"
          : "${PANEL_URL:?PRODUCTION_PANEL_URL is required}"
          : "${ADMIN_PATH:?PRODUCTION_ADMIN_PATH is required}"
          : "${DEPLOY_SSH_KEY:?PRODUCTION_DEPLOY_SSH_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?PRODUCTION_SSH_KNOWN_HOSTS is required}"
          test "${PANEL_URL}" = 'https://panel.uegov.org'
          test "${ADMIN_PATH}" = 'unitedearthgov'
          test "${SSH_USER}" = 'xboard-ci'
          [[ "${THEME_IMAGE}" =~ ^ghcr\.io/voidintheshell/dk_theme:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]

      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          install -d -m 700 "${SSH_DIR}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${SSH_DIR}/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${SSH_DIR}/known_hosts"

      - name: Deploy production theme through the forced command
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          printf '%s\n' "${GHCR_TOKEN}" | ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" \
            "deploy-theme ${GITHUB_SHA} ${THEME_IMAGE} ${GITHUB_ACTOR}"

      - name: Verify public theme and protected runtime from JPGREEN
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" verify-theme

      - name: Remove the ephemeral deploy identity
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          rm -rf -- "${SSH_DIR}"

  release:
    name: Publish complete version
    needs: [prepare-release, build-and-push]
    if: needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - name: Publish only after every required artifact is ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/release.py complete
