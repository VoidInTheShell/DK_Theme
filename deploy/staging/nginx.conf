map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve compose service names at request time so a recreated backend
    # or admin container with a new address never strands a cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Rendered at container start and refreshed from Xboard's internal-only
    # endpoint. It contains the one currently active administrator route.
    include /var/run/xboard-admin-route/*.conf;

    location ^~ /dk-theme/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ "^/(?:api(?:/|$)|storage(?:/|$)|ws$|s(?:/|$)|theme(?:/|$)|assets(?:/|$))" {
        set $xboard_panel_upstream http://xboard-app:7001;
        proxy_pass $xboard_panel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
